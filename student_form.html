<!DOCTYPE html>
<html>
<head>
    <title>{% if student %}Edit{% else %}Add{% endif %} Student</title>
</head>
<body>
    <h1>{% if student %}Edit Student{% else %}Create New Student{% endif %}</h1>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <p style="color:red">{{messages[0]}}</p>
        {% endif %}
    {% endwith %}
    <form method="POST">
        <label>Full Name *</label>
        <input type="text" name="full_name" value="{{student.full_name if student else ''}}" required><br>

        <label>Grade *</label>
        <input type="text" name="grade" value="{{student.grade if student else ''}}" required><br>

        <label>Family Contact *</label>
        <input type="text" name="family_contact" value="{{student.family_contact if student else ''}}" required><br>

        <button type="submit">Save</button>
    </form>
    <a href="{{url_for('student.student_list')}}">Back to list</a>
</body>
</html>
