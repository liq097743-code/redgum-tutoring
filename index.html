<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Redgum Tutoring scheduling and session tracking system">
  <title>Redgum Tutoring</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#dashboard" aria-label="Redgum Tutoring home">
      <span class="brand-mark" aria-hidden="true">R</span>
      <span><strong>Redgum Tutoring</strong><small>Scheduling & session records</small></span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="#dashboard" data-route="dashboard">Dashboard</a>
      <a href="#students" data-route="students">Students</a>
      <a href="#tutors" data-route="tutors">Tutors</a>
      <a href="#sessions" data-route="sessions">Sessions</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <dialog id="student-dialog">
    <form method="dialog" id="student-form">
      <div class="dialog-heading">
        <h2 id="student-dialog-title">Add student</h2>
        <button class="icon-button" value="cancel" aria-label="Close">×</button>
      </div>
      <input type="hidden" name="id">
      <label>Full name <input name="name" required maxlength="80"></label>
      <label>Email <input name="email" type="email" required maxlength="120"></label>
      <label>Phone <input name="phone" maxlength="30"></label>
      <p class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel">Cancel</button>
        <button class="button primary" value="save">Save student</button>
      </div>
    </form>
  </dialog>

  <dialog id="tutor-dialog">
    <form method="dialog" id="tutor-form">
      <div class="dialog-heading">
        <h2 id="tutor-dialog-title">Add tutor</h2>
        <button class="icon-button" value="cancel" aria-label="Close">×</button>
      </div>
      <input type="hidden" name="id">
      <label>Full name <input name="name" required maxlength="80"></label>
      <label>Email <input name="email" type="email" required maxlength="120"></label>
      <label>Subjects <input name="subjects" required placeholder="Mathematics, Physics"></label>
      <fieldset>
        <legend>Availability window</legend>
        <div class="form-grid three">
          <label>Day
            <select name="day" required>
              <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
              <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
            </select>
          </label>
          <label>Start <input name="start" type="time" value="09:00" required></label>
          <label>End <input name="end" type="time" value="17:00" required></label>
        </div>
        <p class="hint">Add further weekly windows by editing the tutor after saving.</p>
      </fieldset>
      <p class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel">Cancel</button>
        <button class="button primary" value="save">Save tutor</button>
      </div>
    </form>
  </dialog>

  <dialog id="session-dialog">
    <form method="dialog" id="session-form">
      <div class="dialog-heading">
        <h2 id="session-dialog-title">Book session</h2>
        <button class="icon-button" value="cancel" aria-label="Close">×</button>
      </div>
      <input type="hidden" name="id">
      <div class="form-grid two">
        <label>Student <select name="studentId" required></select></label>
        <label>Tutor <select name="tutorId" required></select></label>
        <label>Date <input name="date" type="date" required></label>
        <label>Start time <input name="startTime" type="time" required></label>
        <label>Duration
          <select name="duration" required>
            <option value="30">30 minutes</option>
            <option value="45">45 minutes</option>
            <option value="60" selected>60 minutes</option>
            <option value="90">90 minutes</option>
            <option value="120">120 minutes</option>
          </select>
        </label>
        <label>Status
          <select name="status">
            <option>Scheduled</option><option>Attended</option><option>No-show</option><option>Cancelled</option>
          </select>
        </label>
      </div>
      <label>Notes <textarea name="notes" rows="3" maxlength="300" placeholder="Learning goals or preparation notes"></textarea></label>
      <div class="availability-note" id="availability-note"></div>
      <p class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel">Cancel</button>
        <button class="button primary" value="save">Save session</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
